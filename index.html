<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ぽてっと、ほめくじ</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app-container">
        <header>
            <div class="status-item">
                <span>なかま:</span>
                <span id="unlocked-count">1</span> / 4
            </div>
            <div class="status-item">
                <span>お世話度:</span>
                <span id="love-points">0</span>
            </div>
        </header>

        <main>
            <div id="character-selector" class="hidden">
                <p class="instruction-text">だれとお話しする？</p>
                <div id="animal-tabs">
                    </div>
            </div>

            <div id="game-zone">
                <div id="animal-container">
                    <div id="animal-sprite" class="sleeping">
                        <svg viewBox="0 0 100 100" width="100%" height="100%">
                            <ellipse cx="50" cy="85" rx="35" ry="8" fill="#e0dacf" opacity="0.7"/>
                            <circle id="svg-body" cx="50" cy="55" r="30" fill="#f4ece1"/>
                            <path id="svg-ear-l" d="M23 40 Q13 45 18 70 Q23 75 28 55 Z" fill="#cfbba3"/>
                            <path id="svg-ear-r" d="M77 40 Q87 45 82 70 Q77 75 72 55 Z" fill="#cfbba3"/>
                            <path id="svg-eye-l" d="M33 55 Q40 58 42 55" stroke="#7a6e61" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                            <path id="svg-eye-r" d="M58 55 Q60 58 67 55" stroke="#7a6e61" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                            <circle cx="30" cy="62" r="4" fill="#fca1a1" opacity="0.6"/>
                            <circle cx="70" cy="62" r="4" fill="#fca1a1" opacity="0.6"/>
                            <circle cx="50" cy="60" r="2.5" fill="#524941"/>
                            <path d="M47 64 Q50 66 53 64" stroke="#524941" stroke-width="2" stroke-linecap="round" fill="none"/>
                            <g id="zzz-group">
                                <text x="72" y="32" class="zzz-text" font-size="8">z</text>
                                <text x="78" y="24" class="zzz-text" font-size="11">Z</text>
                            </g>
                        </svg>
                    </div>
                </div>

                <p id="prompt-text">キャバリアちゃんが すやすや 眠っています。<br>タップして 起こしてあげてね。</p>

                <div id="result-card" class="hidden">
                    <h2 id="award-title">🏆 がんばったで賞</h2>
                    <p id="award-message">今日もお仕事へ行っただけで100点満点だよ〜。ぽてっとのんびり、休もうねぇ。</p>
                    <button id="close-btn">ありがとう</button>
                </div>
            </div>
        </main>

        <div class="audio-toggle">
            <button id="bgm-btn">🎵 音声をオンにする</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
